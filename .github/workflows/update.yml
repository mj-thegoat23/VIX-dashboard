name: Update market data

on:
  schedule:
    # Weekdays at 22:30 UTC (about 6:30 pm Eastern), after the US close.
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to commit series.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python fetch_series.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add series.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

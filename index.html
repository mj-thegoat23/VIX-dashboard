<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIX Dashboard</title>
<script>
  // Apply the saved theme before the page paints, so there is no flash.
  (function () {
    var t = localStorage.getItem("vix_theme") ||
            (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg:#000000; --panel:#121414; --line:#23272a; --text:#f4f6f5; --muted:#9ba3a0;
    --track:#0b0d0d; --button-text:#03140a; --blue:#00d64f;
    /* gauge colours are the same in both themes */
    --green:#3fb950; --amber:#d29922; --red:#f85149;
    --arc-green:#1d4d2a; --arc-amber:#4d3d18; --arc-red:#4d1f1d;
  }
  html[data-theme="light"] {
    --bg:#f4f5f3; --panel:#ffffff; --line:#e4e7e3; --text:#0d1210; --muted:#667069;
    --track:#eef0ec; --button-text:#ffffff; --blue:#00803c;
    /* lighter versions of the same gauge colours, for the light theme */
    --green:#56d364; --amber:#e9b13c; --red:#ff7b72;
    --arc-green:#a8e6b4; --arc-amber:#f3dc9a; --arc-red:#ffc2bd;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex;
           justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  header h1 { margin:0; font-size:20px; font-weight:600; }
  .meta { color:var(--muted); font-size:12px; }
  main { padding:16px 24px 40px; display:grid; gap:16px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; }
  h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
  .card { text-align:center; }
  .gauge { width:100%; max-width:220px; height:auto; }
  .val { font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; }
  .name { font-size:12px; color:var(--muted); margin-top:2px; }
  .sub { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .bars { display:grid; gap:8px; }
  .bar-row { display:grid; grid-template-columns:130px 1fr 70px; align-items:center; gap:10px; font-variant-numeric:tabular-nums; }
  .bar-track { background:var(--track); border-radius:6px; height:18px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--blue); }
  .bar-val { text-align:right; }
  .note { font-size:11px; color:var(--muted); margin:10px 0 0; }
  .ok { color:var(--green); } .bad { color:var(--red); }
  .na { color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  .spark { width:100%; height:60px; }
  header { border-bottom:none; }
  header h1 { font-size:22px; letter-spacing:-.01em; }
  .theme-toggle { background:var(--blue); color:var(--button-text); border:0; border-radius:999px;
                  padding:8px 16px; font-weight:600; font-size:13px; font-family:inherit; cursor:pointer; }
  .theme-toggle:hover { opacity:.9; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>VIX Dashboard</h1>
  <button id="themeToggle" class="theme-toggle" type="button">Light mode</button>
  <div class="meta" id="meta">Loading…</div>
  <div class="meta" id="sched"></div>
  <div class="meta" id="countdown"></div>
</header>

<main>
  <section>
    <details>
      <summary>Data status</summary>
      <table><thead><tr><th>Series</th><th>Yahoo symbol</th><th>Status</th></tr></thead>
      <tbody id="status"></tbody></table>
    </details>
  </section>

  <div id="app"></div>
</main>

<script>
// =====================================================================
// Config. series.json is generated by fetch_series.py (run by GitHub Actions).
// =====================================================================
const WIN = 252;   // trading days in 52 weeks

const SYMBOLS = {
  vix:    { sym: "^VIX",   label: "VIX" },
  vvix:   { sym: "^VVIX",  label: "VVIX" },
  vix9d:  { sym: "^VIX9D", label: "VIX 9-day" },
  vix3m:  { sym: "^VIX3M", label: "VIX 3-month" },
  vix6m:  { sym: "^VIX6M", label: "VIX 6-month" },
  skew:   { sym: "^SKEW",  label: "SKEW" },
  move:   { sym: "^MOVE",  label: "MOVE" },
  spx:    { sym: "^GSPC",  label: "S&P 500" },
  gold:   { sym: "GC=F",   label: "Gold" },
  wti:    { sym: "CL=F",   label: "WTI" },
  copper: { sym: "HG=F",   label: "Copper" },
  ust10y: { sym: "^TNX",   label: "US 10Y yield (%)" },
  hy:     { sym: "HYG",    label: "HYG price (HY bond proxy)" },
};

// =====================================================================
// Loading
// =====================================================================
async function loadAll() {
  let pre = null, loadErr = "";
  try {
    const r = await fetch("series.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    pre = await r.json();
  } catch (e) {
    loadErr = "series.json not found yet (" + e.message + ")";
  }
  const R = {};
  for (const key of Object.keys(SYMBOLS)) {
    const s = pre && pre.series && pre.series[key];
    R[key] = (s && s.data && s.data.length > 10)
      ? { data: s.data, error: null }
      : { data: null, error: loadErr || "missing from series.json" };
  }
  return { R, updated: pre ? pre.updated_utc : null, cron: pre ? pre.schedule_cron : null };
}

// =====================================================================
// Math
// =====================================================================
function rangeStats(vals) {
  const v = vals.filter(x => x != null && !isNaN(x)).slice(-WIN);
  if (!v.length) return null;
  const cur = v[v.length - 1];
  const lo = Math.min(...v), hi = Math.max(...v);
  return { current: cur, lo52: lo, hi52: hi, pct: hi > lo ? 100 * (cur - lo) / (hi - lo) : 50 };
}

function rollingStats(arr, n) {
  const mean = new Array(arr.length).fill(NaN), sd = new Array(arr.length).fill(NaN);
  for (let i = n - 1; i < arr.length; i++) {
    const w = arr.slice(i - n + 1, i + 1);
    if (w.some(v => v == null || isNaN(v))) continue;
    const m = w.reduce((a, b) => a + b, 0) / n;
    mean[i] = m;
    sd[i] = Math.sqrt(w.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1));
  }
  return { mean, sd };
}

function rsiArr(arr, n = 14) {
  const out = new Array(arr.length).fill(NaN);
  const g = [NaN], l = [NaN];
  for (let i = 1; i < arr.length; i++) {
    const d = arr[i] - arr[i - 1];
    g.push(Math.max(d, 0)); l.push(Math.max(-d, 0));
  }
  for (let i = n; i < arr.length; i++) {
    const up = g.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n;
    const dn = l.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n;
    out[i] = dn === 0 ? 100 : 100 - 100 / (1 + up / dn);
  }
  return out;
}

const toMap = s => new Map(s.map(x => [x.d, x.v]));

function buildAligned(vixS, vvixS, spxS) {
  const vm = toMap(vixS), wm = toMap(vvixS), sm = toMap(spxS);
  const dates = [...vm.keys()].filter(d => wm.has(d) && sm.has(d)).sort();
  return {
    dates,
    vix: dates.map(d => vm.get(d)),
    vvix: dates.map(d => wm.get(d)),
    spx: dates.map(d => sm.get(d)),
  };
}

function ivpAt(vixArr, i) {
  const cur = vixArr[i], past = vixArr.slice(i - WIN, i);
  return 100 * past.filter(v => v < cur).length / past.length;
}

// =====================================================================
// Rendering
// =====================================================================
const fmt = (v, d = 2) => (v == null || isNaN(v)) ? "n/a" : Number(v).toFixed(d);
// Dollar prices with thousands separators, e.g. $4,052.10
const usd = v => (v == null || isNaN(v)) ? "n/a"
  : "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function gaugeHTML(g, label, unit = "", invert = false, money = false) {
  const F = money ? usd : fmt;
  if (!g) return `<div class="card"><div class="val na">n/a</div><div class="name">${label}</div><div class="sub">unavailable</div></div>`;
  const W = 200, H = 120, cx = 100, cy = 105, r = 80;
  const p = Math.max(0, Math.min(1, g.pct / 100));
  const ang = Math.PI * (1 - p);
  const nx = cx + (r - 14) * Math.cos(ang), ny = cy - (r - 14) * Math.sin(ang);
  const arc = (a0, a1, c) => {
    const x0 = cx + r * Math.cos(a0), y0 = cy - r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
    return `<path d="M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}" style="stroke:${c}" stroke-width="12" fill="none"/>`;
  };
  const color = invert
    ? (p < 0.33 ? "var(--red)" : p < 0.66 ? "var(--amber)" : "var(--green)")
    : (p < 0.33 ? "var(--green)" : p < 0.66 ? "var(--amber)" : "var(--red)");
  return `<div class="card">
    <svg class="gauge" viewBox="0 0 ${W} ${H}">
      ${arc(Math.PI, Math.PI*2/3, invert ? "var(--arc-red)" : "var(--arc-green)")}${arc(Math.PI*2/3, Math.PI/3, "var(--arc-amber)")}${arc(Math.PI/3, 0, invert ? "var(--arc-green)" : "var(--arc-red)")}
      <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" style="stroke:${color}" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="5" style="fill:${color}"/>
      <text x="${cx-r+4}" y="${cy+14}" fill="var(--muted)" font-size="10" text-anchor="start">${F(g.lo52)}</text>
      <text x="${cx+r-4}" y="${cy+14}" fill="var(--muted)" font-size="10" text-anchor="end">${F(g.hi52)}</text>
    </svg>
    <div class="val" style="color:${color}">${F(g.current)}${unit}</div>
    <div class="name">${label}</div>
    <div class="sub">52w ${F(g.lo52)} – ${F(g.hi52)} · ${fmt(g.pct, 0)}% of range</div>
  </div>`;
}

function plainCard(v, label, sub, d = 2) {
  return `<div class="card"><div class="val${v == null ? " na" : ""}">${v == null ? "n/a" : fmt(v, d)}</div><div class="name">${label}</div><div class="sub">${sub}</div></div>`;
}

function termBars(items) {
  const vals = items.map(i => i.v).filter(v => v != null);
  const max = vals.length ? Math.max(...vals) * 1.1 : 1;
  return `<div class="bars">${items.map(i => i.v == null
    ? `<div class="bar-row"><div>${i.k}</div><div class="bar-track"></div><div class="bar-val na">n/a</div></div>`
    : `<div class="bar-row"><div>${i.k}</div><div class="bar-track"><div class="bar-fill" style="width:${(i.v / max * 100).toFixed(1)}%"></div></div><div class="bar-val">${fmt(i.v)}</div></div>`
  ).join("")}</div>`;
}

// Term structure as a curve: x = days to expiry, y = VIX level.
function termCurve(items) {
  const pts = items.filter(i => i.v != null).sort((a, b) => a.days - b.days);
  if (pts.length < 2) return `<div class="na">Not enough term points to draw a curve.</div>`;
  const W = 600, H = 240, padL = 50, padR = 20, padT = 20, padB = 40;
  const maxDays = Math.max(...pts.map(p => p.days)) * 1.05;
  const vals = pts.map(p => p.v);
  const vmin = Math.min(...vals) * 0.95, vmax = Math.max(...vals) * 1.05;
  const x = d => padL + (d / maxDays) * (W - padL - padR);
  const y = v => H - padB - ((v - vmin) / (vmax - vmin || 1)) * (H - padT - padB);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p.days).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const dots = pts.map(p => `
    <circle cx="${x(p.days).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="var(--blue)"/>
    <text x="${x(p.days).toFixed(1)}" y="${(y(p.v) - 10).toFixed(1)}" fill="var(--text)" font-size="11" text-anchor="middle">${fmt(p.v)}</text>
    <text x="${x(p.days).toFixed(1)}" y="${H - padB + 16}" fill="var(--muted)" font-size="10" text-anchor="middle">${p.k}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--line)"/>
    <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2"/>
    ${dots}
  </svg>`;
}

function sparkSVG(vals, color) {
  const v = vals.filter(x => x != null && !isNaN(x));
  if (v.length < 2) return `<div class="na">n/a</div>`;
  const W = 300, H = 60, mn = Math.min(...v), mx = Math.max(...v);
  const pts = v.map((y, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(H - ((y - mn) / (mx - mn || 1)) * (H - 6) - 3).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/></svg>`;
}

// Turns a cron expression (in UTC) into a readable update schedule in Eastern time.
function describeCron(c) {
  if (!c) return "schedule not available yet";
  const [min, hr, , , dow] = c.trim().split(/\s+/);
  const etHour = h => {
    const d = new Date();
    d.setUTCHours(h, 0, 0, 0);
    return d.toLocaleTimeString("en-US", { timeZone: "America/Toronto", hour: "numeric", minute: "2-digit" });
  };
  let mins;
  const step = min.match(/^\*\/(\d+)$/);
  if (step) mins = `every ${step[1]} min`;
  else if (min === "*") mins = "every minute";
  else mins = "once a day";
  let hrs = "";
  const range = hr.match(/^(\d+)-(\d+)$/);
  if (range) hrs = `, ${etHour(+range[1])} to ${etHour(+range[2])} ET`;
  else if (/^\d+$/.test(hr)) hrs = `, at ${etHour(+hr)} ET`;
  const days = dow === "1-5" ? ", weekdays" : dow === "*" ? ", every day" : "";
  return `updates ${mins}${hrs}${days}`;
}

// Matches one cron field against a value: "*", "*/N", "A-B", or a single number.
function cronMatch(field, value) {
  if (field === "*") return true;
  const step = field.match(/^\*\/(\d+)$/);
  if (step) return value % +step[1] === 0;
  const range = field.match(/^(\d+)-(\d+)$/);
  if (range) return value >= +range[1] && value <= +range[2];
  return +field === value;
}

// Next UTC time the cron expression fires, after `from`. Cron hours and days are UTC.
function nextRun(c, from = new Date()) {
  const [min, hr, , , dow] = c.trim().split(/\s+/);
  const t = new Date(from.getTime());
  t.setUTCSeconds(0, 0);
  t.setUTCMinutes(t.getUTCMinutes() + 1);
  for (let i = 0; i < 60 * 24 * 10; i++) {
    if (cronMatch(min, t.getUTCMinutes()) && cronMatch(hr, t.getUTCHours()) && cronMatch(dow, t.getUTCDay())) return t;
    t.setUTCMinutes(t.getUTCMinutes() + 1);
  }
  return null;
}

let countdownTimer = null;
function startCountdown(c) {
  clearInterval(countdownTimer);
  const el = document.getElementById("countdown");
  const next = c ? nextRun(c) : null;
  if (!next) { el.textContent = ""; return; }

  const fmtLeft = ms => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = n => String(n).padStart(2, "0");
    return h ? `${h}h ${pad(m)}m ${pad(sec)}s` : `${m}m ${pad(sec)}s`;
  };
  const tick = () => {
    const ms = next - new Date();
    if (ms <= 0) {
      el.textContent = "Next update: running now…";
      clearInterval(countdownTimer);
      setTimeout(load, 90000);   // give the workflow time to finish, then reload the data
      return;
    }
    el.textContent = `Next update in ${fmtLeft(ms)}`;
  };
  tick();
  countdownTimer = setInterval(tick, 1000);
}

function renderStatus(R) {
  document.getElementById("status").innerHTML = Object.entries(R).map(([k, r]) =>
    `<tr><td>${SYMBOLS[k].label}</td><td>${SYMBOLS[k].sym}</td>
     <td class="${r.data ? "ok" : "bad"}">${r.data ? `ok · ${r.data.length} rows · last ${r.data[r.data.length - 1].d}` : (r.error || "no data")}</td></tr>`
  ).join("") + `<tr><td>Put/call ratio</td><td>—</td><td class="na">no free Yahoo source</td></tr>`;
}

// =====================================================================
// Main
// =====================================================================
async function load() {
  const meta = document.getElementById("meta");
  const app = document.getElementById("app");
  const { R, updated, cron } = await loadAll();
  document.getElementById("sched").textContent = describeCron(cron);
  startCountdown(cron);
  renderStatus(R);

  const d = k => R[k].data;
  if (!d("vix") || !d("vvix") || !d("spx")) {
    meta.textContent = "Data not available yet.";
    app.innerHTML = `<section><p class="bad">The core series (VIX, VVIX, S&amp;P 500) are missing from series.json. Check the GitHub Actions run, or wait for the next scheduled update.</p></section>`;
    return;
  }

  const A = buildAligned(d("vix"), d("vvix"), d("spx"));
  const { dates, vix, vvix, spx } = A;
  const n = dates.length;
  const ratio = vvix.map((v, i) => v / vix[i]);
  const ret = spx.map((p, i) => i === 0 ? NaN : Math.log(p / spx[i - 1]));
  const { mean: m20, sd: s20 } = rollingStats(vix, 20);
  const hv20 = rollingStats(ret, 20).sd.map(s => s * Math.sqrt(252) * 100);
  const hv30 = rollingStats(ret, 30).sd.map(s => s * Math.sqrt(252) * 100);
  const prem20 = vix.map((v, i) => v - hv20[i]);
  const prem30 = vix.map((v, i) => v - hv30[i]);
  const zNow = (vix[n - 1] - m20[n - 1]) / s20[n - 1];
  const rsiVix = rsiArr(vix);

  const gVix = rangeStats(vix);
  const gVvix = rangeStats(vvix);
  const gRatio = rangeStats(ratio);
  const gPrem20 = rangeStats(prem20);
  const gPrem30 = rangeStats(prem30);
  const gRsi = rangeStats(rsiVix);

  const ivpSeries = [];
  for (let i = WIN; i < n; i++) ivpSeries.push(ivpAt(vix, i));
  const ivpStats = ivpSeries.length ? rangeStats(ivpSeries) : null;
  const gIvp = ivpStats ? { ...ivpStats, current: ivpSeries[ivpSeries.length - 1] } : null;
  if (gIvp) gIvp.pct = gIvp.hi52 > gIvp.lo52 ? 100 * (gIvp.current - gIvp.lo52) / (gIvp.hi52 - gIvp.lo52) : 50;

  const last = k => d(k) ? d(k)[d(k).length - 1].v : null;
  const gFor = k => rangeStats((d(k) || []).map(x => x.v));

  const sec = (title, body, note = "") =>
    `<section><h2>${title}</h2>${body}${note ? `<p class="note">${note}</p>` : ""}</section>`;

  meta.textContent = `Data as of ${dates[n - 1]}` +
    (updated ? ` · updated ${new Date(updated).toLocaleString()}` : "") +
    " · gauges show 52-week low/high";

  app.innerHTML = [
    sec("VIX levels — position within 52-week range", `<div class="grid">
      ${gaugeHTML(gVix, "VIX level")}
      ${gaugeHTML(gVvix, "VVIX level")}
      ${gaugeHTML(gRatio, "VVIX / VIX ratio")}
      ${gaugeHTML(gIvp, "IV percentile (IVP)")}
    </div>`, "IVP = share of the prior 252 sessions in which VIX closed below today's level."),

    sec("VIX premium — VIX minus realized volatility", `<div class="grid">
      ${gaugeHTML(gPrem20, "VIX − 20d realized vol")}
      ${gaugeHTML(gPrem30, "VIX − 30d realized vol")}
    </div>`, "Realized vol = annualized sample std of S&P 500 daily log returns over the window."),

    sec("VIX term structure", termCurve([
      { k: "9-day", days: 9, v: last("vix9d") },
      { k: "Spot (30-day)", days: 30, v: vix[n - 1] },
      { k: "3-month", days: 91, v: last("vix3m") },
      { k: "6-month", days: 182, v: last("vix6m") },
    ]), "Plotted by days to expiry."),

    sec("Other VIX indicators", `<div class="grid">
      ${gaugeHTML(gRsi, "VIX RSI (14)")}
      ${gaugeHTML({ current: zNow, lo52: 0, hi52: 2, pct: Math.max(0, Math.min(2, zNow)) / 2 * 100 }, "VIX z-score (20d), scale 0–2")}
      ${plainCard(null, "CBOE equity put/call", "no free Yahoo source")}
      ${gaugeHTML(gFor("skew"), "SKEW index")}
    </div>`),

    sec("Cross-asset indicators", `<div class="grid">
      ${gaugeHTML(gFor("move"), "MOVE index")}
      ${gaugeHTML(gFor("hy"), "HYG price (HY bond proxy)", "", true, true)}
      ${gaugeHTML(gFor("gold"), "Gold ($/oz)", "", true, true)}
      ${gaugeHTML(gFor("wti"), "WTI oil ($/bbl)", "", true, true)}
      ${gaugeHTML(gFor("copper"), "Copper ($/lb)", "", true, true)}
      ${gaugeHTML(gFor("ust10y"), "US 10Y yield", "%")}
    </div>`, "HYG is an ETF price, not the credit spread. It moves opposite to spreads: a falling HYG price means widening spreads."),

    sec("Last 252 sessions", `<div class="grid" style="grid-template-columns:1fr 1fr">
      <div><div class="name">VIX</div>${sparkSVG(vix.slice(-WIN), "var(--blue)")}</div>
      <div><div class="name">VVIX</div>${sparkSVG(vvix.slice(-WIN), "var(--amber)")}</div>
      <div><div class="name">VIX − 20d realized</div>${sparkSVG(prem20.slice(-WIN), "var(--green)")}</div>
      <div><div class="name">VIX − 30d realized</div>${sparkSVG(prem30.slice(-WIN), "var(--green)")}</div>
    </div>`),
  ].join("");
}

// Light / dark toggle. The choice is saved in this browser.
const themeBtn = document.getElementById("themeToggle");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("vix_theme", t);
  themeBtn.textContent = t === "light" ? "Dark mode" : "Light mode";
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"));
applyTheme(document.documentElement.getAttribute("data-theme") || "dark");

load();
</script>
</body>
</html>
